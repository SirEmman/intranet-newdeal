name: CI Pipeline

on:
  push:
    branches:
      - dev

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t intranet-newdeal .

  scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan sécurité
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: intranet-newdeal

  push:
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal