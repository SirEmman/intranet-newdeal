name: CI Pipeline

on:
  push:
    branches:
      - dev

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest

  scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Scan sécurité
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest

  push:
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Fin pipeline
        run: echo "Pipeline terminé avec succès"
